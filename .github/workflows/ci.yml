name: Java Maven CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Build Docker image
        run: docker build -t my-first-cicd-project:1.0 .

      - name: Test Docker container
        run: |
          docker run -d \
            --name test-container \
            -p 8080:8080 \
            my-first-cicd-project:1.0

          sleep 10

          curl --fail http://localhost:8080/

          docker stop test-container
          docker rm test-container

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/My-first-cicd-project

            echo "Pulling latest code..."
            git pull origin main

            echo "Building Spring Boot application..."
            mvn -B clean package

            echo "Building Docker image..."
            docker build -t my-first-cicd-project:1.0 .

            echo "Stopping old container..."
            docker stop my-first-cicd-project || true

            echo "Removing old container..."
            docker rm my-first-cicd-project || true

            echo "Starting new container..."
            docker run -d \
              --name my-first-cicd-project \
              -p 8080:8080 \
              my-first-cicd-project:1.0

            echo "Waiting for application..."
            sleep 10

            echo "Testing application..."
            curl --fail http://localhost:8080/

            echo "Deployment successful!"
