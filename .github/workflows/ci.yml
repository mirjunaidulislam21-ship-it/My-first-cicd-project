name: Java Maven CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Build Docker image
        run: docker build -t my-first-cicd-project:1.0 .

      - name: Test Docker container
        run: docker run --rm my-first-cicd-project:1.0

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/My-first-cicd-project
            git pull origin main
            mvn -B clean package
            docker build -t my-first-cicd-project:1.0 .
            docker stop my-first-cicd-project || true
            docker rm my-first-cicd-project || true
            docker run -d --name my-first-cicd-project my-first-cicd-project:1.0
