name: Java Maven CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Build Docker image
        run: docker build -t my-first-cicd-project:1.0 .

      - name: Test Docker container
        run: |
          docker run -d \
            --name test-container \
            -p 8080:8080 \
            my-first-cicd-project:1.0

          echo "Waiting for application to become healthy..."

          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              test-container 2>/dev/null || echo "starting")

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Docker container is healthy!"

              echo "Application response:"
              curl --fail http://localhost:8080/

              docker rm -f test-container
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "Application failed health check."
              echo "Docker logs:"
              docker logs test-container

              docker rm -f test-container
              exit 1
            fi

            echo "Waiting... attempt $i/30"
            sleep 2
          done

          echo "Application did not become healthy in time."
          echo "Docker container status:"
          docker ps -a

          echo "Docker logs:"
          docker logs test-container

          docker rm -f test-container
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd ~/My-first-cicd-project

            echo "====================================="
            echo "Pulling latest code..."
            echo "====================================="

            git pull origin main

            echo "====================================="
            echo "Building Spring Boot application..."
            echo "====================================="

            mvn -B clean package

            echo "====================================="
            echo "Building Docker image..."
            echo "====================================="

            docker build -t my-first-cicd-project:1.0 .

            echo "====================================="
            echo "Stopping old container..."
            echo "====================================="

            docker stop my-first-cicd-project || true
            docker rm my-first-cicd-project || true

            echo "====================================="
            echo "Starting new container..."
            echo "====================================="

            docker run -d \
              --name my-first-cicd-project \
              -p 8080:8080 \
              my-first-cicd-project:1.0

            echo "====================================="
            echo "Waiting for Docker health check..."
            echo "====================================="

            for i in {1..30}; do

              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                my-first-cicd-project 2>/dev/null || echo "starting")

              echo "Health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "====================================="
                echo "Application is healthy!"
                echo "====================================="

                echo "Application response:"
                curl --silent --fail http://localhost:8080/

                echo
                echo "====================================="
                echo "Deployment successful!"
                echo "====================================="

                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "====================================="
                echo "Application is unhealthy!"
                echo "====================================="

                echo "Docker container status:"
                docker ps -a

                echo "Docker logs:"
                docker logs my-first-cicd-project

                exit 1
              fi

              echo "Waiting... attempt $i/30"
              sleep 2

            done

            echo "====================================="
            echo "Application failed to become healthy."
            echo "====================================="

            echo "Docker container status:"
            docker ps -a

            echo "Docker logs:"
            docker logs my-first-cicd-project

            exit 1
